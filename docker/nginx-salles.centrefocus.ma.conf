# =============================================================================
# salles.centrefocus.ma -> FAAS (gestion des salles) — vhost prêt à l'emploi
# =============================================================================
#
# À AJOUTER dans la configuration du Nginx de façade (conteneur
# `formationfocus-nginx`, fichier /etc/nginx/conf.d/formationfocus.conf), en
# suivant exactement le modèle du bloc `lms.centrefocus.ma`.
#
# PRÉREQUIS, dans l'ordre :
#
#   1. Enregistrement DNS chez le registrar :
#          salles.centrefocus.ma.   A   84.8.223.62
#      Vérifier avec :  getent hosts salles.centrefocus.ma
#
#   2. Étendre le certificat Let's Encrypt existant au nouveau nom. Le
#      certificat `centrefocus.ma` couvre déjà centrefocus.ma, www et lms ; il
#      faut le réémettre en ajoutant salles :
#
#          docker compose -f <compose-du-proxy> run --rm certbot certonly \
#            --webroot -w /var/www/certbot \
#            -d centrefocus.ma -d www.centrefocus.ma \
#            -d lms.centrefocus.ma -d salles.centrefocus.ma \
#            --expand
#
#      Le bloc HTTP ci-dessous doit être en place AVANT cette commande, sinon le
#      challenge ACME sur salles.centrefocus.ma échoue.
#
#   3. nginx -t puis recharger.
#
#   4. Autoriser le nouveau nom côté Django, dans le `.env` du projet, sinon
#      toute requête repart en 400 « Invalid HTTP_HOST header » :
#
#          DJANGO_ALLOWED_HOSTS=...,salles.centrefocus.ma
#          CORS_ALLOWED_ORIGINS=...,https://salles.centrefocus.ma
#
#      puis `docker compose up -d backend` pour recharger la configuration.
#
# Le backend FAAS écoute sur l'hôte en 8010 et le frontend en 8090 (voir le
# .env du projet). Depuis le conteneur nginx, l'hôte est joignable via
# l'interface bridge Docker : 172.17.0.1.
# -----------------------------------------------------------------------------

upstream faas_frontend {
    server 172.17.0.1:8090;
    keepalive 16;
}

upstream faas_backend {
    server 172.17.0.1:8010;
    keepalive 16;
}

# -- HTTP : challenge ACME + redirection vers HTTPS ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name salles.centrefocus.ma;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -- HTTPS --------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name salles.centrefocus.ma;

    ssl_certificate     /etc/letsencrypt/live/centrefocus.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centrefocus.ma/privkey.pem;

    client_max_body_size 25m;

    # L'API est publique en lecture ; l'écriture exige un jeton d'administrateur.
    location /api/ {
        proxy_pass http://faas_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /admin/ {
        proxy_pass http://faas_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /static/ {
        proxy_pass http://faas_backend;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Tout le reste : l'application web (React).
    location / {
        proxy_pass http://faas_frontend;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
