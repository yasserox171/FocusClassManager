services:
  db:
    image: postgres:16-alpine
    container_name: faas-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faas}
      POSTGRES_USER: ${POSTGRES_USER:-faas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-faas} -d ${POSTGRES_DB:-faas}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: faas-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: faas-backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn faas.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Africa/Casablanca}
      POSTGRES_DB: ${POSTGRES_DB:-faas}
      POSTGRES_USER: ${POSTGRES_USER:-faas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faas}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: faas-frontend
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_files:
