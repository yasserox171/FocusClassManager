server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets never change - cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The API and the Django admin live on the backend container.
    location ~ ^/(api|admin|static|health)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mobile app download page and the APK itself (mounted from ../downloads).
    # Declared before the SPA fallback so a missing APK returns a real 404 that
    # the page can detect, instead of silently serving index.html.
    location = /download {
        return 301 /download/;
    }

    location /download/ {
        alias /usr/share/nginx/html/download/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location ~ \.apk$ {
        root /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="focus-salles.apk"';
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client side routing: every unknown path renders the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
